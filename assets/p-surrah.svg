<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 340" width="600" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
.a{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ln{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.p{animation:pulse 1.8s ease-out infinite}.f{animation:flt 6s ease-in-out infinite}
.s{animation:spin 40s linear infinite}.u{transform-origin:left center;transform-box:fill-box;animation:ln 1.2s .4s cubic-bezier(.2,.7,.2,1) both}
